<script>
// CW PLAY Cinema login: uses your store login (Discord or CW PLAY account), then sends you back to the cinema.
(async () => {
  const box = document.getElementById('cinemaLogin');
  const CINEMA = 'https://series.cwplaymusic.com/';
  const head = () => {
    const h = el('header', 'shop-head'); const d = el('div');
    d.append(el('span', 'shop-kicker', 'CW PLAY Cinema'), el('h2', null, 'Log in to CW PLAY Cinema'),
      el('p', null, 'Use the same account as Fizzy\'s Store. Watching needs a CW PLAY Cinema Pass.'));
    h.append(d); return h;
  };
  if (!readLogin()) {
    const card = el('div', 'pd-buybox');
    const peek = el('a', 'shop-btn shop-btn--ghost', 'Just look around');
    peek.href = CINEMA;
    const row = el('div', 'adm-actions');
    row.append(loginLink('Log in'), peek);
    card.append(el('p', null, 'Log in with Discord or a CW PLAY account. You\'ll come back to the cinema right after.'), row);
    box.replaceChildren(head(), card);
    return;
  }
  box.replaceChildren(head(), el('p', null, 'Opening CW PLAY Cinema…'));
  const r = await apiCall(CREDITS_API.replace('credits.php', 'cinema.php'), 'issue');
  if (!r.ok) {
    const card = el('div', 'pd-buybox');
    card.append(el('p', null, r.data.error || 'Something went wrong. Try again.'), loginLink('Log in again'));
    box.replaceChildren(head(), card);
    return;
  }
  window.location.replace(CINEMA + 'index.html#uye=' + encodeURIComponent(r.data.token));
})();
</script>
