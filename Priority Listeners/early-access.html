<!-- ===== Priority Listeners: abone olan dinleyiciler =====
     early-access.html'de bölümün görünmesini istediğin yere yapıştır (</main>'den önce gibi).
     Sadece siparişi "Delivered" (teslim edildi) olan dinleyiciler listelenir. -->
<section class="pl-listeners" id="listeners">
  <h2>Our Priority Listeners</h2>
  <p class="pl-lead">Listeners who hear new CW PLAY tracks first. Check out their channels!</p>
  <div class="pl-grid" id="plGrid"><p class="pl-empty">Loading…</p></div>
</section>

<style>
  .pl-listeners { max-width: 1100px; margin: 48px auto; padding: 0 20px; }
  .pl-listeners h2 { margin: 0 0 6px; }
  .pl-lead { margin: 0 0 20px; opacity: 0.8; }
  .pl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .pl-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); }
  .pl-avatar { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: #087a43; color: #fff; font-weight: 700; font-size: 18px; text-transform: uppercase; }
  .pl-info { display: grid; min-width: 0; gap: 2px; }
  .pl-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-since { font-size: 13px; opacity: 0.7; }
  .pl-yt { justify-self: start; margin-top: 4px; padding: 4px 12px; border-radius: 999px; background: #c4302b; color: #fff; font-size: 13px; font-weight: 700; text-decoration: none; }
  .pl-yt:hover { background: #a3271f; }
  .pl-empty { grid-column: 1 / -1; opacity: 0.8; }
  .pl-empty a { color: inherit; font-weight: 700; }
</style>

<script>
(() => {
  const API = 'https://medya.cwplaymusic.com/fizzy/status.php?listeners=1';
  const STORE = 'https://cwplaymusic.com/product.html?item=priority-listeners';
  const grid = document.getElementById('plGrid');
  const safe = (u) => /^https:\/\/(www\.|m\.)?youtube\.com\//i.test(u) ? u : null;
  fetch(API + '&t=' + Date.now(), { cache: 'no-store' })
    .then((r) => r.json()).catch(() => ({}))
    .then((d) => {
      const list = (d && d.listeners) || [];
      grid.replaceChildren();
      if (!list.length) {
        const p = document.createElement('p');
        p.className = 'pl-empty';
        p.append('No listeners yet. ');
        const a = document.createElement('a');
        a.href = STORE;
        a.textContent = 'Be the first one!';
        p.append(a);
        grid.append(p);
        return;
      }
      list.forEach((l) => {
        const card = document.createElement('div');
        card.className = 'pl-card';
        const av = document.createElement('span');
        av.className = 'pl-avatar';
        av.textContent = (l.name || '?').charAt(0);
        const info = document.createElement('div');
        info.className = 'pl-info';
        const name = document.createElement('span');
        name.className = 'pl-name';
        name.textContent = l.name;
        const since = document.createElement('span');
        since.className = 'pl-since';
        since.textContent = 'Listener since ' + new Date(l.since * 1000).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
        info.append(name, since);
        const url = safe(l.channel);
        if (url) {
          const yt = document.createElement('a');
          yt.className = 'pl-yt';
          yt.href = url;
          yt.target = '_blank';
          yt.rel = 'noopener nofollow';
          yt.textContent = '▶ YouTube';
          info.append(yt);
        }
        card.append(av, info);
        grid.append(card);
      });
    });
})();
</script>
<!-- ===== /Priority Listeners ===== -->
