<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Logging in — CW PLAY</title>
<link rel="icon" href="https://cwplaymusic.com/Icon/CW_PLAY_PFP.png">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    box-sizing: border-box;
    background: #160f1f;
    color: #f4eff9;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .box {
    width: 100%;
    max-width: 420px;
    padding: 28px 30px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 18px;
    background: #1f1630;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
  }
  h1 { margin: 0 0 10px; font-size: 1.3rem; }
  p { margin: 0; color: #b8aac9; line-height: 1.55; }
  a {
    display: inline-flex;
    margin-top: 18px;
    padding: 10px 18px;
    border-radius: 12px;
    background: #e0457b;
    color: #fff;
    font-weight: 600;
    text-decoration: none;
  }
  a[hidden] { display: none; }
</style>
</head>
<body>
<main class="box" aria-live="polite">
  <h1 id="title">Logging in with Discord…</h1>
  <p id="text">One moment, please.</p>
  <a id="back" href="index.html#store" hidden>Back to the store</a>
</main>

<script>
// Discord sends the visitor back here (not to the order server) with ?code=...&state=...&iss=...
// This page sends only "code" and "state" to the server in the background and gets a login token.
(async function () {
  const API = 'https://medya.cwplaymusic.com/fizzy/callback.php';
  const q = new URLSearchParams(window.location.search);
  history.replaceState(null, '', window.location.pathname); // don't keep the code in the address bar or history

  const show = (title, text) => {
    document.getElementById('title').textContent = title;
    document.getElementById('text').textContent = text;
    document.getElementById('back').hidden = false;
  };

  if (q.get('error')) {
    show('Login cancelled', 'You didn\'t approve the Discord login. You need to log in to send an order or a comment.');
    return;
  }
  const code = q.get('code');
  const state = q.get('state');
  if (!code || !state) {
    show('Login link expired', 'Go back to the store and log in again.');
    return;
  }

  try {
    const res = await fetch(API, {
      method: 'POST',
      // text/plain = "simple request": no OPTIONS pre-check
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify({ code, state }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok || !data.token) {
      show('Couldn\'t log in', data.error || 'Try again in a few minutes.');
      return;
    }
    // script.js on the store page picks the token up from here and, if you started on a product page, takes you back there
    window.location.replace(new URL('index.html', window.location.href).pathname + '#store&login=' + data.token);
  } catch (err) {
    show('Couldn\'t log in', 'Check your connection and try again.');
  }
})();
</script>
</body>
</html>
